<!doctype html>
<html lang="en" data-maestrly-shortcuts="none">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Viewer de design · protótipo</title>
    <link rel="stylesheet" href="viewer.css" />
    <link rel="stylesheet" href="proto.css" />
    <style>
      /* The prototype's state picker. Not part of the design: hidden in captures (?capture) and never ported. */
      .proto-states {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 70;
        display: grid;
        justify-items: end;
        gap: 8px;
      }
      .proto-states-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px 0 6px;
        border: 1px dashed rgba(255, 204, 64, 0.6);
        border-radius: 999px;
        background: #26221a;
        color: var(--ink);
        font-size: 12px;
        box-shadow: var(--shadow);
      }
      .proto-states-tag {
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--mark);
        color: #1b1c1f;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .proto-states-menu {
        width: 360px;
        max-height: min(560px, calc(100vh - 80px));
        padding: 6px;
        overflow-y: auto;
        border: 1px solid var(--line-2);
        border-radius: 12px;
        background: var(--pop);
        box-shadow: var(--shadow);
      }
      .proto-states-item {
        display: grid;
        gap: 1px;
        padding: 7px 9px;
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
      }
      .proto-states-item:hover,
      .proto-states-item[aria-current='true'] {
        background: var(--hover);
      }
      .proto-states-item code {
        color: var(--mark);
        font: 11px var(--mono);
      }
      .proto-states-item span {
        color: var(--ink-2);
        font-size: 12px;
      }
      @media (max-width: 720px) {
        .proto-states {
          right: 8px;
          bottom: 8px;
        }
        .proto-states-button > span:not(.proto-states-tag) {
          display: none;
        }
        .proto-states-menu {
          width: calc(100vw - 16px);
        }
      }
    </style>
    <script src="messages.js"></script>
    <script src="proto.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

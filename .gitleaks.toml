[extend]
useDefault = true

[[allowlists]]
description = "Non-secret idempotency fixtures in bridge/router tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^test/unit/chat-chatgpt-web-(?:bridge|router)\.test\.ts$''']
regexTarget = "line"
regexes = ['''(?:idempotency_key|idempotencyKey)\s*:\s*['"][a-z0-9][a-z0-9-]*['"]''']

[[allowlists]]
description = "Exact vendor-owned public OAuth client identifier for a secretless desktop flow"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^src/main/chat/grok-subscription/oauth\.ts$''',
]
regexTarget = "line"
regexes = [
  '''DEFAULT_XAI_OAUTH_CLIENT_ID\s*=\s*['"]b1a00492-073a-47ea-816f-4c329264a828['"]''',
]

[[allowlists]]
description = "Exact dummy auth secret in the disposable PostgreSQL integration harness history"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^scripts/test-integration\.mjs$''']
regexTarget = "line"
regexes = ['''BETTER_AUTH_SECRET: 'integration-secret-0123456789abcdef'''']

[[allowlists]]
description = "Exact synthetic credential used to verify compaction diagnostic redaction"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/desktop/test/unit/chat-compaction-progress-service\.test\.ts$''']
regexTarget = "line"
regexes = ['''new Error\('Summary service rejected request: OPENAI_API_KEY=synthetic-secret-123'\)''']

[[allowlists]]
description = "Exact synthetic Cursor token asserting SDK credential redaction in tests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^apps/desktop/test/unit/chat-cursor-portable-summarizer\.test\.ts$''',
  '''^apps/desktop/test/unit/chat-cursor-sdk-stream-map\.test\.ts$''',
  '''^apps/desktop/test/unit/chat-cursor-subscription-drain\.test\.ts$''',
  '''^apps/desktop/test/unit/chat-cursor-subscription-runner\.test\.ts$''',
  '''^apps/desktop/test/unit/chat-cursor-subscription-session-store\.test\.ts$''',
]
regexTarget = "line"
regexes = ['''const (?:crsrSecret|secret|token) = 'crsr_live_AbCdEf1234567890'''']

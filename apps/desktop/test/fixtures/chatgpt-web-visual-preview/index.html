<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Review Smoke Fixture</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12131a; color: #f5f7ff; font: 16px system-ui; }
      main { width: 520px; padding: 28px; border: 1px solid #34384d; border-radius: 18px; background: #1b1e2a; }
      canvas { display: block; width: 100%; height: 220px; margin: 18px 0; border-radius: 12px; background: #090a0f; }
      label { display: grid; gap: 6px; }
      input, button { border: 1px solid #555d82; border-radius: 8px; padding: 10px 12px; color: inherit; background: #24283a; }
      button { margin-top: 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Visual Review smoke</h1>
      <canvas id="art" width="928" height="440" aria-label="Generated test artwork"></canvas>
      <label>Reviewer note <input id="note" autocomplete="off" /></label>
      <button id="toggle" type="button">Change artwork</button>
    </main>
    <script>
      const canvas = document.querySelector('#art')
      const context = canvas.getContext('2d')
      let alternate = false
      function draw() {
        context.clearRect(0, 0, canvas.width, canvas.height)
        context.fillStyle = alternate ? '#ff3fa4' : '#30d8ff'
        context.beginPath()
        if (alternate) {
          context.arc(464, 220, 128, 0, Math.PI * 2)
        } else {
          context.moveTo(464, 48)
          context.lineTo(650, 360)
          context.lineTo(278, 360)
          context.closePath()
        }
        context.fill()
      }
      document.querySelector('#toggle').addEventListener('click', () => {
        alternate = !alternate
        draw()
      })
      draw()
    </script>
  </body>
</html>

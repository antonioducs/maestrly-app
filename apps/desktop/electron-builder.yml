appId: io.github.antonioducs.maestrly
productName: Maestrly App
directories:
  output: dist

files:
  - out/**
  - resources/**
  - "!resources/tunnel-client/**"
  - "!resources/sounds/**"
  - "!resources/licenses/**"
  - "!resources/codex/**"
  - "!resources/github-copilot/**"
  - "!node_modules/**/@github/copilot-{darwin,linux,linuxmusl,win32}-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-{darwin,linux,linuxmusl,win32}-*/**"
  - "!node_modules/**/@koromix/koffi-*/**"
  - "!node_modules/koffi/**"
  - "!node_modules/@xenova/transformers/**"
  - "!node_modules/@huggingface/jinja/**"
  - "!node_modules/onnxruntime-{node,common,web}/**"
  - "!node_modules/sharp/**"
  - package.json

extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # The package wrapper stages exactly one verified target archive for offline installation.
  - from: runtime-assets/local-ml/bundle/
    to: local-ml/
  - from: resources/sounds/
    to: sounds/
  - from: resources/licenses/
    to: licenses/

asarUnpack:
  - node_modules/node-pty/**
  - "**/*.node"
  - "**/*.dylib"
  - "**/*.dll"
  - "**/*.so"
  - "**/*.so.*"

mac:
  icon: resources/icon.icns
  target:
    - dir
  category: public.app-category.developer-tools
  identity: '-'
  extendInfo:
    NSMicrophoneUsageDescription: Maestrly App uses the microphone for voice dictation processed locally on your computer.

win:
  icon: resources/icon.ico
  target:
    - nsis

nsis:
  oneClick: true
  perMachine: false

toolsets:
  appimage: '1.0.2'

afterPack: ../../scripts/after-pack.mjs

linux:
  executableName: maestrly-app
  icon: resources/icons
  category: Development
  maintainer: Maestrly contributors <noreply@maestrly.com>
  target:
    - AppImage
    - deb

npmRebuild: true

publish: null

appId: io.github.antonioducs.maestrly
productName: Maestrly App
directories:
  output: dist

files:
  - out/**
  - resources/**
  - "!resources/tunnel-client/**"
  - "!resources/sounds/**"
  - "!resources/licenses/**"
  - "!resources/codex/**"
  - "!resources/github-copilot/**"
  - "!node_modules/**/@github/copilot-{darwin,linux,linuxmusl,win32}-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-{darwin,linux,linuxmusl,win32}-*/**"
  - "!node_modules/**/@koromix/koffi-*/**"
  - "!node_modules/koffi/**"
  - "!node_modules/@xenova/transformers/**"
  - "!node_modules/@huggingface/jinja/**"
  - "!node_modules/onnxruntime-{node,common,web}/**"
  - "!node_modules/sharp/**"
  # The renderer bundles Mermaid (src/renderer/lib/mermaid.ts); its packaged copies keep only their licenses.
  - "!node_modules/mermaid/dist/**"
  - "!node_modules/@mermaid-js/parser/dist/**"
  - package.json

extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # The package wrapper stages exactly one verified target archive for offline installation.
  - from: runtime-assets/local-ml/bundle/
    to: local-ml/
  - from: resources/sounds/
    to: sounds/
  - from: resources/licenses/
    to: licenses/
  # The bot server installer runs this Compose file on this computer or copies it to a VPS.
  - from: ../../deploy/bot-fleet/compose.yml
    to: bot-server/compose.yml

asarUnpack:
  - "node_modules/@cursor/sdk-*/bin/**"
  - "node_modules/@cursor/sdk-*/vendor/**"
  - node_modules/node-pty/**
  - "**/*.node"
  - "**/*.dylib"
  - "**/*.dll"
  - "**/*.so"
  - "**/*.so.*"

mac:
  icon: resources/icon.icns
  target:
    - dir
  category: public.app-category.developer-tools
  # node-pty ships prebuilds for every platform, and packaging rebuilds it into build/Release anyway. The x64 helper
  # is the Apple silicon app's only Intel code, and macOS warns that the app depends on Rosetta because of it.
  files:
    - "!node_modules/node-pty/prebuilds/!(darwin-${arch})/**"
  # Electron 44 requires macOS 13. Beta, development, and release configurations inherit this minimum.
  minimumSystemVersion: '13.0.0'
  identity: '-'
  extendInfo:
    NSMicrophoneUsageDescription: Maestrly App uses the microphone for voice dictation processed locally on your computer.

win:
  icon: resources/icon.ico
  target:
    - nsis

nsis:
  oneClick: true
  perMachine: false

toolsets:
  appimage: '1.0.2'

afterPack: ../../scripts/after-pack.mjs

deb:
  packageName: maestrly-app
  artifactName: maestrly-app_${version}_${arch}.${ext}
  # electron-builder's defaults, plus the libraries the Electron binary links that a minimal desktop install lacks.
  # Ubuntu 24.04 renamed ALSA's library package to libasound2t64; Debian 12 and Ubuntu 22.04 still ship libasound2.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1

linux:
  executableName: maestrly-app
  icon: resources/icons
  category: Development
  maintainer: Maestrly contributors <noreply@maestrly.com>
  target:
    - AppImage
    - deb

npmRebuild: true

publish:
  provider: github
  owner: antonioducs
  repo: maestrly-app
  releaseType: release

name: QA build

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qa-build.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to package
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: qa-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MAIN_VITE_GITHUB_COPILOT_CLIENT_ID: ${{ vars.MAESTRLY_GITHUB_COPILOT_CLIENT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Electron system libraries
        run: npx playwright install-deps chromium
      - name: Build Linux packages
        run: npm run package:linux
      - name: Verify embedded build configuration
        run: node scripts/check-release-build-config.mjs --bundle apps/desktop/out/main
      - name: Stage Linux release assets
        run: node scripts/stage-release-assets.mjs linux apps/desktop/dist .release-local-staging/linux
      - name: Write QA build metadata and checksums
        id: meta
        env:
          STAGING_DIR: .release-local-staging/linux
          REQUESTED_REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs'
          import path from 'node:path'

          const stagingDir = process.env.STAGING_DIR
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const sha7 = commit.slice(0, 7)
          const ref = process.env.REQUESTED_REF?.trim()
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const date = new Date().toISOString()
          const runId = process.env.RUN_ID?.trim()

          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error(`Invalid commit SHA: ${commit}`)
          if (!ref) throw new Error('Missing requested ref')
          if (!version) throw new Error('Missing package.json version')
          if (!runId) throw new Error('Missing workflow run ID')

          const files = readdirSync(stagingDir).sort()
          if (files.length === 0) throw new Error(`No staged files found in ${stagingDir}`)
          const checksums = files.map((file) => {
            const fullPath = path.join(stagingDir, file)
            if (statSync(fullPath).size === 0) throw new Error(`Staged file is empty: ${file}`)
            const digest = createHash('sha256').update(readFileSync(fullPath)).digest('hex')
            return `${digest}  ${file}\n`
          })
          writeFileSync(path.join(stagingDir, 'SHA256SUMS.txt'), checksums.join(''))

          const metadata = [
            `commit=${commit}`,
            `ref=${ref}`,
            `version=${version}`,
            `date=${date}`,
            `run_id=${runId}`,
            '',
          ].join('\n')
          writeFileSync(path.join(stagingDir, 'qa-build.txt'), metadata)
          appendFileSync(process.env.GITHUB_OUTPUT, `sha7=${sha7}\n`)
          NODE
      - name: Upload Linux QA build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-build-linux-${{ steps.meta.outputs.sha7 }}
          path: .release-local-staging/linux
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      MAIN_VITE_GITHUB_COPILOT_CLIENT_ID: ${{ vars.MAESTRLY_GITHUB_COPILOT_CLIENT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows package
        run: npm run package:win
      - name: Verify embedded build configuration
        run: node scripts/check-release-build-config.mjs --bundle apps/desktop/out/main
      - name: Stage Windows release assets
        run: node scripts/stage-release-assets.mjs windows apps/desktop/dist .release-local-staging/windows
      - name: Write QA build metadata and checksums
        id: meta
        env:
          STAGING_DIR: .release-local-staging/windows
          REQUESTED_REF: ${{ inputs.ref || github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs'
          import path from 'node:path'

          const stagingDir = process.env.STAGING_DIR
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const sha7 = commit.slice(0, 7)
          const ref = process.env.REQUESTED_REF?.trim()
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const date = new Date().toISOString()
          const runId = process.env.RUN_ID?.trim()

          if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error(`Invalid commit SHA: ${commit}`)
          if (!ref) throw new Error('Missing requested ref')
          if (!version) throw new Error('Missing package.json version')
          if (!runId) throw new Error('Missing workflow run ID')

          const files = readdirSync(stagingDir).sort()
          if (files.length === 0) throw new Error(`No staged files found in ${stagingDir}`)
          const checksums = files.map((file) => {
            const fullPath = path.join(stagingDir, file)
            if (statSync(fullPath).size === 0) throw new Error(`Staged file is empty: ${file}`)
            const digest = createHash('sha256').update(readFileSync(fullPath)).digest('hex')
            return `${digest}  ${file}\n`
          })
          writeFileSync(path.join(stagingDir, 'SHA256SUMS.txt'), checksums.join(''))

          const metadata = [
            `commit=${commit}`,
            `ref=${ref}`,
            `version=${version}`,
            `date=${date}`,
            `run_id=${runId}`,
            '',
          ].join('\n')
          writeFileSync(path.join(stagingDir, 'qa-build.txt'), metadata)
          appendFileSync(process.env.GITHUB_OUTPUT, `sha7=${sha7}\n`)
          NODE
      - name: Upload Windows QA build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-build-windows-${{ steps.meta.outputs.sha7 }}
          path: .release-local-staging/windows
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

name: Debug standalone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: macOS trace
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx playwright test test/e2e/standalone-chats.spec.ts:13 --repeat-each 2
        working-directory: apps/desktop

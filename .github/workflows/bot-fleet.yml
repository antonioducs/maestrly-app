name: Bot fleet

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/bot-fleet/**
      - apps/bot-gateway/**
      - packages/bot-fleet-protocol/**
      - apps/desktop/src/main/fleet/**
      - apps/desktop/package.json
      - package-lock.json
      - .nvmrc
      - scripts/bot-fleet-images.mjs
      - scripts/test-bot-fleet-e2e.mjs
      - .github/workflows/bot-fleet.yml
  push:
    branches: [main]
    paths:
      - deploy/bot-fleet/**
      - apps/bot-gateway/**
      - packages/bot-fleet-protocol/**
      - apps/desktop/src/main/fleet/**
      - apps/desktop/package.json
      - package-lock.json
      - .nvmrc
      - scripts/bot-fleet-images.mjs
      - scripts/test-bot-fleet-e2e.mjs
      - .github/workflows/bot-fleet.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    name: Bot fleet containers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install dependencies
        run: npm ci
      - name: Build bot fleet images
        run: node scripts/bot-fleet-images.mjs --platform linux/amd64
      - name: Test bot fleet containers
        run: npm run test:e2e:bot-fleet
      - name: Upload bot fleet diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bot-fleet-diagnostics
          path: .bot-fleet-local/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

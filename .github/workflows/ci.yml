name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer commit supersedes a pull request's run. On main a running validation always finishes, because only main
  # runs the complete macOS and Windows suites.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests run every Linux suite and only the unit tests on macOS and Windows; main and manual runs, which can
# target a pull request's branch, run every suite on every platform.
jobs:
  linux:
    name: Linux suites
    uses: ./.github/workflows/ci-desktop.yml
    with:
      os: ubuntu-24.04
      complete: true
  macos:
    name: macOS suites
    uses: ./.github/workflows/ci-desktop.yml
    with:
      os: macos-15
      complete: ${{ github.event_name != 'pull_request' }}
  windows:
    name: Windows suites
    uses: ./.github/workflows/ci-desktop.yml
    with:
      os: windows-2025
      complete: ${{ github.event_name != 'pull_request' }}

  # The stable check names the main ruleset requires: each passes only when every suite its platform ran passed.
  linux-result:
    name: Linux
    needs: linux
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the Linux suites
        env:
          RESULT: ${{ needs.linux.result }}
        run: test "$RESULT" = success
  macos-result:
    name: macOS
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the macOS suites
        env:
          RESULT: ${{ needs.macos.result }}
        run: test "$RESULT" = success
  windows-result:
    name: Windows
    needs: windows
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the Windows suites
        env:
          RESULT: ${{ needs.windows.result }}
        run: test "$RESULT" = success

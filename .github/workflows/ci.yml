name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux suites
    uses: ./.github/workflows/ci-desktop.yml
    with:
      os: ubuntu-24.04
  macos:
    name: macOS suites
    uses: ./.github/workflows/ci-desktop.yml
    with:
      os: macos-15
  windows:
    name: Windows suites
    uses: ./.github/workflows/ci-desktop.yml
    with:
      os: windows-2025

  # The stable check names the main ruleset requires: each passes only when every suite of its platform passed.
  linux-result:
    name: Linux
    needs: linux
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the Linux suites
        env:
          RESULT: ${{ needs.linux.result }}
        run: test "$RESULT" = success
  macos-result:
    name: macOS
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the macOS suites
        env:
          RESULT: ${{ needs.macos.result }}
        run: test "$RESULT" = success
  windows-result:
    name: Windows
    needs: windows
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the Windows suites
        env:
          RESULT: ${{ needs.windows.result }}
        run: test "$RESULT" = success

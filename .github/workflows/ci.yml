name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
          - label: macOS
            os: macos-15
          - label: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate repository history
        run: npm run check:history
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commits.mjs --subject-env PR_TITLE
      - name: Check application
        run: npm run check
      - name: Install Electron system libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Test Electron on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Test Electron on desktop
        if: runner.os != 'Linux'
        run: npm run test:e2e

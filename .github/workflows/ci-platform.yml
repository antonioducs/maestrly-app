name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check boundaries and public contracts
        run: npm run check:boundaries && npm run check:protocol && npm run check:sdk
      - name: Check server and real PostgreSQL isolation
        run: npm run check:server && npm run test:integration
      - name: Check headless runner without Electron
        run: npm run check:runner
        env:
          DISPLAY: ""
      - name: Check web dashboard
        run: npm run check:web
      - name: Install browsers for each workspace
        run: |
          npm exec --workspace @maestrly/web -- playwright install --with-deps chromium
          npm exec --workspace @maestrly/desktop -- playwright install --with-deps chromium
      - name: Check Host and Bot deterministic suites (no remote hardware)
        run: npm run check:host-phase1
      - name: Check Bot live desktop deterministic suites (no remote hardware)
        run: npm run check:bot-phase3 && npm run test:bot-phase3
      - name: Check Bot team collaboration deterministic suites (no remote hardware)
        run: npm run check:bot-phase4 && npm run test:bot-phase4
      # Routines and voice, with an injected clock and a worker fixture. No microphone, no
      # speech model and no SSH run here: those gates belong to the laboratory report.
      - name: Check Bot routines and voice deterministic suites (no remote hardware)
        run: npm run check:bot-phase5 && npm run test:bot-phase5
      - name: Test Bot local UI
        run: xvfb-run -a npm run test:e2e:bot
      - name: Test Bot team UI
        run: xvfb-run -a npm run test:e2e:bot-teams
      - name: Test Bot routines and voice UI
        run: xvfb-run -a npm run test:e2e:bot-phase5
      # The chat experience: transcript, composer, commands, extensions and usage, all against
      # the interface fixture. The guest-side gates (Codex with MCP and skills) belong to the lab.
      - name: Check Bot chat experience deterministic suites (no remote hardware)
        run: npm run check:bot-chat && npm run test:bot-chat
      - name: Test Bot chat experience UI
        run: xvfb-run -a npm run test:e2e:bot-chat
      - name: Run browser flows
        run: npm run test:e2e:platform
      - name: Run real desktop project chat
        run: xvfb-run -a node scripts/test-project-chat-e2e.mjs
      - name: Preserve project chat evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-chat-evidence
          path: apps/desktop/test-results/
          if-no-files-found: ignore
      - name: Run complete deterministic smoke
        run: npm run smoke:platform
